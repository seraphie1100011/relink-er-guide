name: Refine character directory accordion

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  refine:
    if: github.head_ref == 'refine-character-accordion'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Update interface
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          index = index.replace(
              '<section class="hero" aria-labelledby="pageTitle">',
              '<section class="hero" aria-label="サイト概要">'
          )
          index = index.replace(
              '        <h1 id="pageTitle">キャラクターから、<br>知りたい攻略へ。</h1>\n',
              ''
          )
          index_path.write_text(index, encoding='utf-8')

          app_path = Path('app.js')
          app = app_path.read_text(encoding='utf-8')
          app = app.replace(
              '  query: "",\n  sort: "newest"\n};',
              '  query: "",\n  sort: "newest",\n  expandedCharacters: new Set()\n};'
          )

          character_card = r'''function createCharacterDirectoryCard(character, periodPosts) {
            const posts = periodPosts.filter((post) => post.character === character.value);
            const expanded = state.expandedCharacters.has(character.value);
            const characterIndex = DIRECTORY_CHARACTERS.findIndex((item) => item.value === character.value);
            const panelId = `character-panel-${characterIndex}`;
            const article = document.createElement("article");
            article.className = `directory-card${expanded ? " is-expanded" : ""}${state.character === character.value ? " is-active" : ""}`;

            const header = document.createElement("button");
            header.type = "button";
            header.className = "directory-card-head";
            header.setAttribute("aria-expanded", String(expanded));
            header.setAttribute("aria-controls", panelId);
            header.addEventListener("click", () => {
              if (expanded) state.expandedCharacters.delete(character.value);
              else state.expandedCharacters.add(character.value);
              renderDirectories();
            });
            header.innerHTML = `
              <span><small>${escapeHtml(character.group)}</small><strong>${escapeHtml(character.value)}</strong></span>
              <span class="directory-card-count">
                <b>${posts.length}<small>件</small></b>
                <i aria-hidden="true">${expanded ? "−" : "＋"}</i>
              </span>
            `;

            article.append(header);

            if (expanded) {
              const panel = document.createElement("div");
              panel.id = panelId;
              panel.className = "directory-expanded";

              const actions = document.createElement("div");
              actions.className = "directory-expanded-actions";

              const detailsButton = document.createElement("button");
              detailsButton.type = "button";
              detailsButton.className = "directory-detail-button";
              detailsButton.textContent = "詳しく見る";
              detailsButton.disabled = posts.length === 0;
              detailsButton.addEventListener("click", () => selectCharacter(character.value));
              actions.append(detailsButton);

              panel.append(actions, createDirectoryTitleList(posts, Infinity));
              article.append(panel);
            }

            return article;
          }'''

          app, count = re.subn(
              r'function createCharacterDirectoryCard\(character, periodPosts\) \{.*?\n\}\n\nfunction createTopicDirectoryCard',
              character_card + '\n\nfunction createTopicDirectoryCard',
              app,
              flags=re.S
          )
          if count != 1:
              raise SystemExit(f'createCharacterDirectoryCard replacement count: {count}')

          title_list = r'''function createDirectoryTitleList(posts, limit = Infinity) {
            const wrap = document.createElement("div");
            wrap.className = "directory-titles";

            if (!posts.length) {
              wrap.innerHTML = '<p class="directory-empty">情報はまだありません</p>';
              return wrap;
            }

            const visiblePosts = Number.isFinite(limit) ? posts.slice(0, limit) : posts;
            const list = document.createElement("ul");
            for (const post of visiblePosts) {
              const item = document.createElement("li");
              const link = document.createElement("a");
              link.href = post.sourceUrl;
              link.target = "_blank";
              link.rel = "noopener noreferrer";
              link.title = `${post.title} — Xの投稿を開く`;
              link.innerHTML = `<span>${escapeHtml(post.title)}</span><small aria-hidden="true">↗</small>`;
              item.append(link);
              list.append(item);
            }
            wrap.append(list);

            if (Number.isFinite(limit) && posts.length > limit) {
              const more = document.createElement("p");
              more.className = "directory-more";
              more.textContent = `ほか ${posts.length - limit}件`;
              wrap.append(more);
            }
            return wrap;
          }'''

          app, count = re.subn(
              r'function createDirectoryTitleList\(posts, limit = 3\) \{.*?\n\}\n\nfunction renderResults',
              title_list + '\n\nfunction renderResults',
              app,
              flags=re.S
          )
          if count != 1:
              raise SystemExit(f'createDirectoryTitleList replacement count: {count}')

          app_path.write_text(app, encoding='utf-8')

          css_path = Path('styles.css')
          css = css_path.read_text(encoding='utf-8')
          marker = '/* Character directory accordion refinement */'
          if marker not in css:
              css += r'''

          /* Character directory accordion refinement */
          .hero {
            padding-block: 32px;
          }
          .hero-copy > p:last-child {
            margin-top: 10px;
            font-size: 15px;
          }
          .character-grid {
            align-items: start;
          }
          .directory-card {
            align-self: start;
          }
          .directory-card-head {
            min-height: 68px;
            border-bottom: 0;
          }
          .directory-card.is-expanded .directory-card-head {
            border-bottom: 1px solid var(--line);
          }
          .directory-card-count {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: none;
          }
          .directory-card-count b {
            min-width: auto;
          }
          .directory-card-count i {
            width: 24px;
            height: 24px;
            display: grid;
            place-items: center;
            border: 1px solid color-mix(in srgb, var(--sky) 34%, var(--line));
            border-radius: 50%;
            color: var(--sky-deep);
            font-size: 14px;
            font-style: normal;
            font-weight: 700;
            line-height: 1;
          }
          .directory-expanded {
            background: color-mix(in srgb, var(--surface-soft) 62%, var(--surface));
          }
          .directory-expanded-actions {
            min-height: 34px;
            padding: 8px 14px 0;
            display: flex;
            justify-content: flex-end;
          }
          .directory-detail-button {
            padding: 2px 0 3px;
            border: 0;
            border-bottom: 1px solid color-mix(in srgb, var(--sky) 45%, var(--line));
            background: transparent;
            color: var(--sky-deep);
            font-size: 10px;
            font-weight: 800;
          }
          .directory-detail-button:hover:not(:disabled) {
            color: var(--gold);
            border-color: var(--gold);
          }
          .directory-detail-button:disabled {
            cursor: default;
            opacity: .42;
          }
          .directory-card .directory-titles {
            min-height: 0;
            padding-top: 4px;
          }
          .directory-card .directory-empty {
            margin: 8px 0 10px;
          }
          '''
          css_path.write_text(css, encoding='utf-8')
          PY

      - name: Validate JavaScript
        run: node --check app.js

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.js styles.css
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "キャラクター枠を開閉式の一覧へ改善"
            git push origin HEAD:${{ github.head_ref }}
          fi
