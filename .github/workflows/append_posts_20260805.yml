          ]

          existing_ids = {post.get("id") for post in posts if isinstance(post, dict)}
          existing_urls = {post.get("sourceUrl") for post in posts if isinstance(post, dict)}
          added = []
          for post in new_posts:
              if post["id"] in existing_ids or post["sourceUrl"] in existing_urls:
                  continue
              posts.append(post)
              existing_ids.add(post["id"])
              existing_urls.add(post["sourceUrl"])
              added.append(post["id"])

          path.write_text(json.dumps(posts, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(f"追加件数: {len(added)}")
          print("追加ID:", ", ".join(added))
          print(f"累計件数: {len(posts)}")
          PY

      - name: 追加結果をmainへ保存
        shell: bash
        run: |
          git config user.name "relink-er-site-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/posts.json
          git diff --cached --quiet || git commit -m "X投稿7件をサイトへ追加"
          git push
