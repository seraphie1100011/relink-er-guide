name: X投稿7件を追加

on:
  push:
    paths:
      - ".github/workflows/append_posts_20260805.yml"

permissions:
  contents: write

jobs:
  append-posts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: data/posts.jsonへ追加
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          posts_path = Path("data/posts.json")
          import_path = Path("data/import_20260805.json")
          posts = json.loads(posts_path.read_text(encoding="utf-8"))
          candidates = json.loads(import_path.read_text(encoding="utf-8"))

          existing_ids = {post.get("id") for post in posts if isinstance(post, dict)}
          existing_urls = {post.get("sourceUrl") for post in posts if isinstance(post, dict)}
          added = []
          for post in candidates:
              if post.get("id") in existing_ids or post.get("sourceUrl") in existing_urls:
                  continue
              posts.append(post)
              existing_ids.add(post.get("id"))
              existing_urls.add(post.get("sourceUrl"))
              added.append(post.get("id"))

          posts_path.write_text(json.dumps(posts, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(f"追加件数: {len(added)}")
          print(f"累計件数: {len(posts)}")
          PY

      - name: mainへ保存して一時ファイルを削除
        shell: bash
        run: |
          git config user.name "relink-er-site-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/posts.json
          git rm data/import_20260805.json .github/workflows/append_posts_20260805.yml
          git commit -m "X投稿7件をサイトへ追加"
          git push
