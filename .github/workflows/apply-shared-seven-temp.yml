name: Apply seven shared posts

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'add-shared-seven-posts' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Append posts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          registered_at = "2026-08-01T23:14:00+09:00"
          new_posts = [
            {"id":"x-search-scahigh-lucifer-afk-128-20260731","title":"CHAOS++ルシファーを完全放置1分28秒で討伐","summary":"フルアシストまたはCPU中心の放置構成で、CHAOS++ルシファーを1分28秒で討伐した記録です。投稿者は複数の構成を試した後、以前の構成へ戻したことでこのタイムになったと説明しています。既存の1分39秒・1分50秒記録を更新する候補です。","character":"キャラクター共通","category":"CPU・放置","attributes":["放置","フルアシスト","CPU","周回","ボス攻略","装備"],"sourceUrl":"https://x.com/search?q=from%3AScahigh%20%22CHAOS%2B%2B%E3%83%AB%E3%82%B7%E3%83%95%E3%82%A1%E3%83%BC%E6%94%BE%E7%BD%AE1%3A28%22&f=live","sourceLinkType":"search","author":"@Scahigh","postedAt":"2026-07-31","registeredAt":registered_at,"usefulness":98,"confidence":"中","status":"要追加検証","media":"image"},
            {"id":"x-search-aizdy-fediel-ice-dragon-46s-20260731","title":"フェディエル単騎で氷竜を46秒討伐","summary":"フェディエル単独で氷竜を46秒で討伐したタイムアタック投稿です。同じ投稿者が複数回動画を掲載しており、実際の操作と討伐時間を映像で確認できます。装備、召喚石、マスタースキルの詳細は追加確認が必要です。","character":"フェディエル","category":"キャラクター攻略","attributes":["火力","DPS","単騎","ボス攻略","コンボ","動画"],"sourceUrl":"https://x.com/search?q=from%3AAizdy%20%22%E6%B0%B7%E7%AB%9C%20%E3%83%95%E3%82%A7%E3%83%87%E3%82%A3%E3%82%A8%E3%83%AB%E5%8D%98%E9%A8%8E%2046s%22&f=live","sourceLinkType":"search","author":"@Aizdy","postedAt":"2026-07-31","registeredAt":registered_at,"usefulness":91,"confidence":"中","status":"要追加検証","media":"video"},
            {"id":"x-search-id-awakening-infinite-loop-20260721","title":"イドの覚醒ビルドで神威一体を繰り返す無限ループ","summary":"アビリティを2回使用した後に竜人化し、神威一体を2回発動して全回復までつなげる循環型ビルドです。投稿にはループの実演とビルド詳細が添付されており、覚醒マスタースタイルを使ったイドの継続戦闘例として参考になります。","character":"イド","category":"マスタースキル","attributes":["マスタースキル","アビリティ","コンボ","回復","竜人化","動画"],"sourceUrl":"https://x.com/search?q=%22%E3%82%A4%E3%83%89%E3%81%AE%E5%AE%9F%E6%88%A6%E7%94%A8%E3%80%90%E8%A6%9A%E9%86%92%E3%80%91%E3%83%93%E3%83%AB%E3%83%89%E3%81%A7%E7%84%A1%E9%99%90%E3%83%AB%E3%83%BC%E3%83%97%E3%81%8C%E3%81%A7%E3%81%8D%E3%82%8B%22&f=live","sourceLinkType":"search","author":"不明","postedAt":"2026-07-21","registeredAt":registered_at,"usefulness":96,"confidence":"中","status":"要追加検証","media":"video"},
            {"id":"x-search-virtual-yagi-cagliostro-master-style-202607","title":"カリオストロのマスタースタイルを動画で解説","summary":"カリオストロのマスタースタイルについて、効果や使い方を解説する日本語動画です。検索結果では解説動画の存在は確認できますが、各スタイルの数値、推奨ビルド、検証条件は動画本編の追加確認が必要です。","character":"カリオストロ","category":"マスタースキル","attributes":["マスタースキル","解説","アビリティ","支援","動画"],"sourceUrl":"https://x.com/search?q=from%3AVirtual_yagi%20%22%E3%82%AB%E3%83%AA%E3%82%AA%E3%82%B9%E3%83%88%E3%83%AD%E3%81%AE%E3%83%9E%E3%82%B9%E3%82%BF%E3%83%BC%E3%82%B9%E3%82%BF%E3%82%A4%E3%83%AB%E8%A7%A3%E8%AA%AC%E5%8B%95%E7%94%BB%E3%81%A4%E3%81%8F%E3%81%A3%E3%81%9F%22&f=live","sourceLinkType":"search","author":"@Virtual_yagi","postedAt":"","registeredAt":registered_at,"usefulness":82,"confidence":"低","status":"未確認","media":"video"},
            {"id":"x-search-meeeruuu-beatrix-540m-no-glass-cannon","title":"ベアトリクスが紙一重なしで60秒5.4億","summary":"ベアトリクスのトライアル計測で、紙一重を使用せず約5.4億ダメージを記録した動画投稿です。数値と動画は確認できますが、武器、ジーン、召喚石、マスタースキル、クロックオーデルタの切替手順は追加確認が必要です。","character":"ベアトリクス","category":"キャラクター攻略","attributes":["火力","DPS","トライアル","紙一重なし","コンボ","動画"],"sourceUrl":"https://x.com/search?q=from%3Ameeeruuu1106%20%22%E3%83%99%E3%82%A2%E3%83%88%E3%83%AA%E3%82%AF%E3%82%B9%205.4%E5%84%84%22&f=live","sourceLinkType":"search","author":"@meeeruuu1106","postedAt":"","registeredAt":registered_at,"usefulness":94,"confidence":"中","status":"要追加検証","media":"video"},
            {"id":"x-search-yumemiruozizi-world-defense-comparison","title":"インフィニティ・ザ・ワールドの攻撃で耐久スキルを比較","summary":"HP100％でインフィニティ『ワールドの胎動』を受け、耐久スキルなし、剛健15、ふんばり15、剛健15＋ふんばり15を比較した検証です。基礎条件はマスタースキル防御5％と、防御6％を4枠の合計29％。被ダメージは順に181,097、139,945、142,837、109,984と報告されています。","character":"キャラクター共通","category":"システム・検証","attributes":["防御","ふんばり","剛健","召喚石","高難度","被ダメージ","検証"],"sourceUrl":"https://x.com/search?q=from%3Ayumemiruozizi%20%22%E3%82%B8%E3%83%BC%E3%83%B3%E6%9E%A0%E3%82%92%E8%A9%B0%E3%82%81%E3%82%8B%E3%81%9F%E3%82%81%E6%80%AF%E3%81%BF%E7%84%A1%E5%8A%B9%22&f=live","sourceLinkType":"search","author":"@yumemiruozizi","postedAt":"","registeredAt":registered_at,"usefulness":98,"confidence":"高","status":"要追加検証","media":"image"},
            {"id":"x-search-kosakki-beatrix-yellow-red-clock","title":"通常時は黄針、ブレイク・リンクタイム中は赤針へ切り替えるベアトリクス運用","summary":"通常戦闘ではクロックオーデルタを黄色にしてスーパーアーマーを維持し、敵のブレイク中やリンクタイム中は赤色へ切り替えて火力を伸ばす立ち回りです。黄針による攻撃継続性能と、攻撃機会に合わせた赤針への切替を組み合わせています。","character":"ベアトリクス","category":"キャラクター攻略","attributes":["クロックオーデルタ","スーパーアーマー","火力","リンクタイム","コンボ","動画"],"sourceUrl":"https://x.com/search?q=from%3Akosakki%20%22%E3%82%AF%E3%83%AD%E3%83%83%E3%82%AF%E3%82%AA%E3%83%BC%E3%83%87%E3%83%AB%E3%82%BF%E3%82%92%E9%BB%84%E8%89%B2%22&f=live","sourceLinkType":"search","author":"@kosakki","postedAt":"","registeredAt":registered_at,"usefulness":91,"confidence":"中","status":"要追加検証","media":"video"}
          ]
          path = Path('data/posts.json')
          posts = json.loads(path.read_text(encoding='utf-8'))
          seen_ids = {str(p.get('id','')) for p in posts}
          seen_urls = {str(p.get('sourceUrl','')) for p in posts}
          for post in new_posts:
              if post['id'] not in seen_ids and post['sourceUrl'] not in seen_urls:
                  posts.append(post)
                  seen_ids.add(post['id'])
                  seen_urls.add(post['sourceUrl'])
          path.write_text(json.dumps(posts, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Validate
        run: python -m json.tool data/posts.json >/dev/null
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/posts.json
          if ! git diff --cached --quiet; then
            git commit -m "共有チャットの新規攻略情報7件を追加"
            git push origin HEAD:${{ github.head_ref }}
          fi
