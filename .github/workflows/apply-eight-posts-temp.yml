              "summary": "ベルゼバブ放置周回中、オイゲンとフェディエルが見当たらなくなり、リンクアタックにも反応しなかったという不具合報告です。Endless Ragnarok更新後から発生が目立つとされています。",
              "character": "キャラクター共通",
              "category": "システム・検証",
              "attributes": ["CPU", "放置", "バグ・不具合", "ボス攻略"],
              "sourceUrl": "https://x.com/search?q=from%3ASAO80192849%20%22%E3%83%99%E3%83%AB%E3%82%BC%E3%83%90%E3%83%96%E6%94%BE%E7%BD%AE%E5%91%A8%E5%9B%9E%E3%81%AE%E4%B8%80%E5%B9%95%22&f=live",
              "sourceLinkType": "search",
              "author": "@SAO80192849",
              "postedAt": "2026-08-01T08:34:00+09:00",
              "registeredAt": registered_at,
              "usefulness": 78,
              "confidence": "低",
              "status": "未確認",
              "media": "video"
            },
            {
              "id": "x-search-relink-official-black-crab-20260731",
              "title": "漆黒カニ収集数に応じて強化されるカニジーン",
              "summary": "『恐るべき漆黒のカニジーン』は、保護したリトルスニッパー・ブラックの数に応じて複数の強化効果を発揮することが公式投稿で案内されています。具体的な段階別効果は投稿画像の確認が必要です。",
              "character": "キャラクター共通",
              "category": "ジーン・武器",
              "attributes": ["ジーン", "育成", "素材集め", "装備"],
              "sourceUrl": "https://x.com/search?q=from%3Arelink_official%20%22%E6%81%90%E3%82%8B%E3%81%B9%E3%81%8D%E6%BC%86%E9%BB%92%E3%81%AE%E3%82%AB%E3%83%8B%E3%82%B8%E3%83%BC%E3%83%B3%22&f=live",
              "sourceLinkType": "search",
              "author": "@relink_official",
              "postedAt": "2026-07-31T19:00:00+09:00",
              "registeredAt": registered_at,
              "usefulness": 91,
              "confidence": "高",
              "status": "確認済み",
              "media": "image"
            }
          ]

          posts_path = Path("data/posts.json")
          posts = json.loads(posts_path.read_text(encoding="utf-8"))
          seen_ids = {str(post.get("id", "")) for post in posts}
          seen_urls = {str(post.get("sourceUrl", "")) for post in posts}
          for post in new_posts:
              if post["id"] not in seen_ids and post["sourceUrl"] not in seen_urls:
                  posts.append(post)
                  seen_ids.add(post["id"])
                  seen_urls.add(post["sourceUrl"])
          posts_path.write_text(json.dumps(posts, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          app_path = Path("app.js")
          app = app_path.read_text(encoding="utf-8")
          marker = '  const mediaLabel = post.media === "video" ? "動画" : post.media === "image" ? "画像" : "";'
          addition = marker + '\n  const isSearchLink = post.sourceLinkType === "search" || /https:\\/\\/x\\.com\\/search\\?/.test(post.sourceUrl);\n  const sourceButtonLabel = isSearchLink ? "Xで該当投稿を探す" : "元投稿を開く";'
          if 'const sourceButtonLabel = isSearchLink' not in app:
              app = app.replace(marker, addition)

          trust_row = '        <div><dt>信頼度</dt><dd>${escapeHtml(post.confidence)}</dd></div>'
          trust_addition = trust_row + '\n        ${isSearchLink ? "<div><dt>リンク</dt><dd>X検索結果（元投稿URL要確認）</dd></div>" : ""}'
          if 'X検索結果（元投稿URL要確認）' not in app:
              app = app.replace(trust_row, trust_addition)

          old_button = '元投稿を開く <span aria-hidden="true">↗</span></a>`}'
          new_button = '${escapeHtml(sourceButtonLabel)} <span aria-hidden="true">↗</span></a>`}'
          app = app.replace(old_button, new_button)
          app_path.write_text(app, encoding="utf-8")
          PY

      - name: Validate files
        run: |
          python -m json.tool data/posts.json >/dev/null
          node --check app.js

      - name: Commit generated changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/posts.json app.js
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "X投稿8件をサイトデータへ追加"
            git push origin HEAD:${{ github.head_ref }}
          fi
