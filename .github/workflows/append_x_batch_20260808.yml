name: X攻略候補55件を追加

on:
  push:
    paths:
      - '.github/workflows/append_x_batch_20260808.yml'

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: data/posts.jsonへ未登録URLだけ追加
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          from datetime import datetime, timezone, timedelta

          URLS = '''
          https://x.com/mouzyumamesiba/status/2085447583502336137
          https://x.com/sn426/status/2085309537922465863
          https://x.com/Q25pQNpvm7RKeP9/status/2085262774071120362
          https://x.com/Nagi_Auspicios/status/2085158268071280748
          https://x.com/jmz_b/status/2084963070770626927
          https://x.com/fowsecondgame/status/2084719177731117108
          https://x.com/dqx_weed/status/2084082888866439670
          https://x.com/hirosan2019/status/2077664053166796938
          https://x.com/grigrigringuy/status/2077643191659212842
          https://x.com/miu72amaha/status/2077580963908042825
          https://x.com/hinanaihinanai/status/2077561562781692008
          https://x.com/hirosan2019/status/2077548709110542623
          https://x.com/kemble1_1/status/2077532885054259241
          https://x.com/vQIfy9iwv688477/status/2077522083287126516
          https://x.com/KamuiTakegami/status/2077516991964012696
          https://x.com/age_vocalo1226/status/2077327876840698227
          https://x.com/gaming_miuru/status/2082812987102962003
          https://x.com/gaming_miuru/status/2082777384491639219
          https://x.com/gaming_miuru/status/2082777240056783354
          https://x.com/tengudaruma/status/2082795418585624638
          https://x.com/toufuno_youkai/status/2085339282345205845
          https://x.com/lateroji/status/2085274928958546129
          https://x.com/bunnydrag00n/status/2085250106450952236
          https://x.com/manbou800new/status/2085001280469205290
          https://x.com/Captain7be/status/2084978953215984083
          https://x.com/KayaKayalrkv/status/2084968827004354789
          https://x.com/byakuren3564/status/2085143267583365130
          https://x.com/KamishiroLuLuLu/status/2084950071032828412
          https://x.com/nanase_kuyou/status/2084781123817861131
          https://x.com/yumemiruozizi/status/2084633340695716153
          https://x.com/nanase_kuyou/status/2084345727858467270
          https://x.com/nanase_kuyou/status/2084256147071197529
          https://x.com/yumemiruozizi/status/2083610099038486579
          https://x.com/amai_yuki/status/2083433792237412498
          https://x.com/groupcpu/status/2083345695386615931
          https://x.com/StreamTasuke/status/2077748996521836698
          https://x.com/kazuyakozuki1/status/2078077523288867274
          https://x.com/misty4853/status/2078138215056425045
          https://x.com/kazuyakozuki1/status/2077568746521252278
          https://x.com/mak1baoh_go/status/2077255204953817277
          https://x.com/mak1baoh_go/status/2077326748715565091
          https://x.com/Nintro_GR/status/2075932116697907210
          https://x.com/GamerBraves/status/2076590155683778573
          https://x.com/RPGSite/status/2074629524541624796
          https://x.com/Rin_gamediary/status/2078994706281971865
          https://x.com/Rin_gamediary/status/2077698825255534947
          https://x.com/Rin_gamediary/status/2077520859598917645
          https://x.com/Rin_gamediary/status/2078190498502812027
          https://x.com/Rin_gamediary/status/2079803103470350609
          https://x.com/PersonaSpeaks/status/2079702282254299169
          https://x.com/relink_official/status/2075541435886309694
          https://x.com/HiroshiSora/status/2080652909734502665
          https://x.com/Muku0719/status/2076705721912303955
          https://x.com/ichikawanozomu/status/2079263514477342981
          https://x.com/6767milk/status/2076887363251532261
          https://x.com/KamuiTakegami/status/2076073795979550804
          https://x.com/Joesephyr/status/2077414041606148600
          https://x.com/kayanaeya/status/2076293773395624233
          https://x.com/kayanaeya/status/2076674588696842627
          https://x.com/kayanaeya/status/2077053605388149132
          '''.split()

          path = Path('data/posts.json')
          posts = json.loads(path.read_text(encoding='utf-8'))
          if not isinstance(posts, list):
              raise SystemExit('data/posts.json is not an array')

          existing_urls = {str(p.get('sourceUrl', '')).rstrip('/') for p in posts if isinstance(p, dict)}
          existing_ids = {str(p.get('id', '')) for p in posts if isinstance(p, dict)}
          jst = timezone(timedelta(hours=9))
          registered_at = datetime.now(jst).replace(microsecond=0).isoformat()

          def posted_at(tweet_id: str) -> str:
              # X/Twitter Snowflake: timestamp(ms) = (id >> 22) + 1288834974657
              ms = (int(tweet_id) >> 22) + 1288834974657
              return datetime.fromtimestamp(ms / 1000, tz=timezone.utc).astimezone(jst).replace(microsecond=0).isoformat()

          added = []
          duplicates = []
          for raw_url in URLS:
              url = raw_url.rstrip('/')
              match = re.fullmatch(r'https://x\.com/([^/]+)/status/(\d+)', url)
              if not match:
                  raise SystemExit(f'Invalid X URL: {url}')
              author, tweet_id = match.groups()
              entry_id = f'x-{tweet_id}'
              if url in existing_urls or entry_id in existing_ids:
                  duplicates.append(url)
                  continue

              entry = {
                  'id': entry_id,
                  'title': f'@{author} の攻略投稿（内容確認待ち）',
                  'summary': 'X収集担当から指定された攻略候補URLです。本文・添付メディアの詳細は未確認のため、内容・キャラクター・数値は断定せず、確認待ちとして登録しています。',
                  'character': 'キャラクター共通',
                  'category': '未分類',
                  'attributes': ['X投稿', '未確認', '要レビュー'],
                  'tags': ['X投稿', '未確認'],
                  'sourceUrl': url,
                  'sourceLinkType': 'exact',
                  'author': f'@{author}',
                  'postedAt': posted_at(tweet_id),
                  'registeredAt': registered_at,
                  'confidence': '低',
                  'status': 'review'
              }
              posts.append(entry)
              existing_urls.add(url)
              existing_ids.add(entry_id)
              added.append(url)

          # 最終重複検証
          ids = [p.get('id') for p in posts if isinstance(p, dict) and p.get('id')]
          source_urls = [p.get('sourceUrl') for p in posts if isinstance(p, dict) and p.get('sourceUrl')]
          if len(ids) != len(set(ids)):
              raise SystemExit('duplicate id detected')
          if len(source_urls) != len(set(source_urls)):
              raise SystemExit('duplicate sourceUrl detected')

          path.write_text(json.dumps(posts, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps({
              'input': len(URLS),
              'added': len(added),
              'duplicates': len(duplicates),
              'total': len(posts),
              'duplicateUrls': duplicates
          }, ensure_ascii=False, indent=2))
          PY

      - name: posts.jsonだけを残して保存
        shell: bash
        run: |
          git config user.name 'relink-er-site-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/posts.json
          git rm .github/workflows/append_x_batch_20260808.yml
          git commit -m 'X攻略候補55件をサイトへ追加'
          git push
