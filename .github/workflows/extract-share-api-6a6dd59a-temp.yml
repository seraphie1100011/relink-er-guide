name: Extract shared chat API 6a6dd59a

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  extract:
    if: github.head_ref == 'extract-share-api-6a6dd59a-20260803'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Fetch and inspect share page
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import urlsplit, urlunsplit
          import html, json, requests, re

          out = Path('tmp/share-api-6a6dd59a')
          out.mkdir(parents=True, exist_ok=True)
          share_id = '6a6dd59a-64c0-83e8-b876-1d347c36e215'
          urls = {
            'page': f'https://chatgpt.com/share/{share_id}',
            'backend_chatgpt': f'https://chatgpt.com/backend-api/share/{share_id}',
            'backend_chatopenai': f'https://chat.openai.com/backend-api/share/{share_id}',
            'public_api': f'https://chatgpt.com/api/share/{share_id}',
          }
          headers = {
            'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36',
            'Accept-Language': 'ja,en-US;q=0.9,en;q=0.8',
            'Accept': 'text/html,application/json;q=0.9,*/*;q=0.8',
          }
          report = {}
          for name, url in urls.items():
            try:
              r = requests.get(url, headers=headers, timeout=30, allow_redirects=True)
              suffix = 'json' if 'application/json' in r.headers.get('content-type','') else 'txt'
              path = out / f'{name}.{suffix}'
              path.write_bytes(r.content)
              report[name] = {
                'url': url,
                'status': r.status_code,
                'final_url': r.url,
                'content_type': r.headers.get('content-type'),
                'bytes': len(r.content),
                'file': str(path),
              }
            except Exception as e:
              report[name] = {'url': url, 'error': repr(e)}

          page_file = out / 'page.txt'
          all_urls = []
          missing_urls = []
          contexts = []
          if page_file.exists():
            raw = page_file.read_text(encoding='utf-8', errors='replace')
            text = html.unescape(raw)
            for _ in range(4):
              previous = text
              text = (text
                .replace('\\u002F', '/')
                .replace('\\u002f', '/')
                .replace('\\u003A', ':')
                .replace('\\u003a', ':')
                .replace('\\u0026', '&')
                .replace('\\/', '/')
                .replace('\\\\', '\\'))
              if text == previous:
                break

            pattern = re.compile(r'https://(?:www\.)?(?:x|twitter)\.com/[^\s"\'<>\\]+', re.I)
            seen = set()
            for match in pattern.finditer(text):
              url = match.group(0).rstrip('.,;:!?)]}、。，」』）')
              url = url.replace('https://twitter.com/', 'https://x.com/').replace('https://www.twitter.com/', 'https://x.com/').replace('https://www.x.com/', 'https://x.com/')
              if url not in seen:
                seen.add(url)
                all_urls.append(url)
                start = max(0, match.start() - 260)
                end = min(len(text), match.end() + 260)
                contexts.append({'url': url, 'context': text[start:end]})

            posts = json.loads(Path('data/posts.json').read_text(encoding='utf-8'))
            existing = {str(post.get('sourceUrl') or '').strip() for post in posts}
            missing_urls = [url for url in all_urls if url not in existing]

            patterns = {
              'conversation_id': r'conversation_id.{0,160}',
              'create_time': r'create_time.{0,160}',
              'safe_urls': r'safe_urls.{0,300}',
              'share_id': re.escape(share_id),
            }
            extracts = {key: re.findall(pattern, text, flags=re.S)[:100] for key, pattern in patterns.items()}
            (out / 'page_extracts.json').write_text(json.dumps(extracts, ensure_ascii=False, indent=2), encoding='utf-8')

          (out / 'all_x_urls.json').write_text(json.dumps(all_urls, ensure_ascii=False, indent=2), encoding='utf-8')
          (out / 'missing_x_urls.json').write_text(json.dumps(missing_urls, ensure_ascii=False, indent=2), encoding='utf-8')
          (out / 'x_url_contexts.json').write_text(json.dumps(contexts, ensure_ascii=False, indent=2), encoding='utf-8')
          report['x_url_count'] = len(all_urls)
          report['missing_x_url_count'] = len(missing_urls)
          report['missing_x_urls'] = missing_urls
          (out / 'report.json').write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY

      - name: Commit extraction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/share-api-6a6dd59a
          if git diff --cached --quiet; then
            echo "No extraction changes"
          else
            git commit -m "共有ページ内のX URLを抽出して照合"
            git push origin HEAD:${{ github.head_ref }}
          fi
