name: Extract shared chat API 6a6dd59a

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  extract:
    if: github.head_ref == 'extract-share-api-6a6dd59a-20260803'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Prepare ChatPeek parser
        run: |
          rm -rf /tmp/ChatPeek
          git clone --depth 1 https://github.com/vl3c/ChatPeek.git /tmp/ChatPeek
          mkdir -p tmp/share-api-6a6dd59a
          cp /tmp/ChatPeek/ChatPeek.py tmp/share-api-6a6dd59a/ChatPeek.py

      - name: Parse messages after 19:00 JST
        run: |
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from urllib.parse import urlsplit, urlunsplit, parse_qsl, urlencode
          import html, json, re, requests, sys

          sys.path.insert(0, '/tmp/ChatPeek')
          import ChatPeek

          out = Path('tmp/share-api-6a6dd59a')
          out.mkdir(parents=True, exist_ok=True)
          share_id = '6a6dd59a-64c0-83e8-b876-1d347c36e215'
          share_url = f'https://chatgpt.com/share/{share_id}'
          headers = dict(ChatPeek.DEFAULT_HEADERS)
          headers['Accept-Language'] = 'ja,en-US;q=0.9,en;q=0.8'
          response = requests.get(share_url, headers=headers, timeout=30)
          response.raise_for_status()
          raw = response.text
          (out / 'page.txt').write_text(raw, encoding='utf-8')

          chat = ChatPeek.parse_modern_share(raw)
          jst = ZoneInfo('Asia/Tokyo')
          threshold = datetime(2026, 8, 3, 19, 0, 0, tzinfo=jst)

          def canonicalize(url: str) -> str:
            url = html.unescape(url.strip().strip('`<>').rstrip('.,;:!?)]}、。，」』）'))
            url = url.replace('https://twitter.com/', 'https://x.com/').replace('https://www.twitter.com/', 'https://x.com/').replace('https://www.x.com/', 'https://x.com/')
            parts = urlsplit(url)
            path = re.sub(r'/(photo|video)/\d+$', '', parts.path)
            query = [(k, v) for k, v in parse_qsl(parts.query, keep_blank_values=True) if k != 'utm_source']
            return urlunsplit(('https', 'x.com', path.rstrip('/'), urlencode(query, doseq=True), ''))

          url_pattern = re.compile(r'https://(?:www\.)?(?:x|twitter)\.com/[^\s"\'<>]+', re.I)
          messages = []
          after_19 = []
          after_19_urls = []
          seen_urls = set()

          for index, reply in enumerate(chat.replies):
            created_jst = None
            if reply.created_at is not None:
              created_jst = datetime.fromtimestamp(reply.created_at, tz=jst)
            row = {
              'index': index,
              'role': reply.type.value,
              'author': reply.author_name,
              'createdAtUnix': reply.created_at,
              'createdAtJst': created_jst.isoformat() if created_jst else None,
              'statement': reply.statement,
            }
            messages.append(row)
            if created_jst and created_jst >= threshold:
              after_19.append(row)
              if reply.type.value == 'assistant':
                for match in url_pattern.findall(reply.statement):
                  url = canonicalize(match)
                  if url not in seen_urls:
                    seen_urls.add(url)
                    after_19_urls.append(url)

          posts = json.loads(Path('data/posts.json').read_text(encoding='utf-8'))
          existing = {canonicalize(str(post.get('sourceUrl') or '')) for post in posts if post.get('sourceUrl')}
          missing = [url for url in after_19_urls if url not in existing]
          existing_matches = [url for url in after_19_urls if url in existing]

          result = {
            'shareId': share_id,
            'chatTitle': chat.title,
            'chatUpdatedAtJst': datetime.fromtimestamp(chat.updated_at, tz=jst).isoformat() if chat.updated_at else None,
            'thresholdJst': threshold.isoformat(),
            'messageCount': len(messages),
            'after19MessageCount': len(after_19),
            'after19UniqueXUrlCount': len(after_19_urls),
            'after19MissingXUrlCount': len(missing),
            'after19XUrls': after_19_urls,
            'missingXUrls': missing,
            'alreadyOnSiteXUrls': existing_matches,
          }
          (out / 'conversation_messages.json').write_text(json.dumps(messages, ensure_ascii=False, indent=2), encoding='utf-8')
          (out / 'after_19_messages.json').write_text(json.dumps(after_19, ensure_ascii=False, indent=2), encoding='utf-8')
          (out / 'after_19_result.json').write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY

      - name: Commit extraction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/share-api-6a6dd59a
          if git diff --cached --quiet; then
            echo "No extraction changes"
          else
            git commit -m "19時以降の共有会話URLを抽出"
            git push origin HEAD:${{ github.head_ref }}
          fi
