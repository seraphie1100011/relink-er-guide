name: Apply exact X post URLs

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'extract-share-api-6a6dd59a-20260803'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Replace search links with exact X post links
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          replacements = {
            'x-search-fume-minq61-perfect-shot-20260724': 'https://x.com/Fume_minq61/status/2080461096696377625',
            'x-search-yumemiruozizi-eiyutan-20260724': 'https://x.com/yumemiruozizi/status/2080457332895707539',
            'x-search-kamishirolululu-garanzza-20260723': 'https://x.com/KamishiroLuLuLu/status/2080097524803575911',
            'x-search-iyou-riri-beelzebub-20260723': 'https://x.com/iyou_riri/status/2080232322587373809',
            'x-search-rin-gamediary-lucifer-150': 'https://x.com/Rin_gamediary/status/2078793795832078693',
            'x-search-nanase-kuyou-magielle-20260801': 'https://x.com/nanase_kuyou/status/2081406052239864302',
            'x-search-sao80192849-beelzebub-20260801': 'https://x.com/SAO80192849/status/2081886094283718705',
            'x-search-relink-official-black-crab-20260731': 'https://x.com/relink_official/status/2081681231075553622',
          }

          path = Path('data/posts.json')
          posts = json.loads(path.read_text(encoding='utf-8'))
          found = set()
          for post in posts:
            post_id = str(post.get('id') or '')
            if post_id not in replacements:
              continue
            post['sourceUrl'] = replacements[post_id]
            post['sourceLinkType'] = 'exact'
            found.add(post_id)

          missing = sorted(set(replacements) - found)
          if missing:
            raise SystemExit(f'missing target IDs: {missing}')

          ids = [str(post.get('id') or '') for post in posts]
          urls = [str(post.get('sourceUrl') or '') for post in posts]
          if len(ids) != len(set(ids)):
            raise SystemExit('duplicate IDs detected')
          if len(urls) != len(set(urls)):
            raise SystemExit('duplicate source URLs detected')

          path.write_text(json.dumps(posts, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps({'updated': len(found), 'ids': sorted(found)}, ensure_ascii=False, indent=2))
          PY

      - name: Remove temporary extraction files
        run: |
          rm -rf tmp/share-api-6a6dd59a
          rm -f tmp/.gitkeep
          rm -f .github/workflows/extract-share-api-6a6dd59a-temp.yml

      - name: Commit final website data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "共有会話8件をX個別投稿URLへ更新"
          git push origin HEAD:${{ github.head_ref }}
