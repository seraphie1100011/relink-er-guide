          path = Path("data/posts.json")
          posts = json.loads(path.read_text(encoding="utf-8"))
          seen_ids = {str(post.get("id", "")) for post in posts}
          seen_urls = {str(post.get("sourceUrl", "")) for post in posts}
          added = []
          for post in new_posts:
              if post["id"] in seen_ids or post["sourceUrl"] in seen_urls:
                  continue
              posts.append(post)
              added.append(post["id"])
              seen_ids.add(post["id"])
              seen_urls.add(post["sourceUrl"])

          if len(added) != 10:
              raise SystemExit(f"Expected 10 additions, got {len(added)}: {added}")

          path.write_text(json.dumps(posts, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print("Added:", *added, sep="\n- ")
          PY

      - name: Validate JSON and uniqueness
        run: |
          python -m json.tool data/posts.json >/dev/null
          python - <<'PY'
          import json
          posts = json.load(open('data/posts.json', encoding='utf-8'))
          ids = [p['id'] for p in posts]
          urls = [p['sourceUrl'] for p in posts]
          assert len(ids) == len(set(ids)), 'duplicate id'
          assert len(urls) == len(set(urls)), 'duplicate sourceUrl'
          assert len(posts) == 28, f'unexpected total: {len(posts)}'
          print(f'Validated {len(posts)} posts')
          PY

