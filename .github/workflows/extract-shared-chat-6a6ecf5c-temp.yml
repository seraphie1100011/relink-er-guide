name: Extract shared chat 6a6ecf5c

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  extract:
    if: github.head_ref == 'import-shared-chat-6a6ecf5c'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Prepare extractor
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests
          git clone --depth 1 https://github.com/vl3c/ChatPeek.git /tmp/ChatPeek

      - name: Extract shared conversation
        run: |
          rm -rf tmp/shared-chat-6a6ecf5c
          mkdir -p tmp/shared-chat-6a6ecf5c
          python /tmp/ChatPeek/ChatPeek.py \
            'https://chatgpt.com/share/6a6ecf5c-bbe4-83ee-a245-fbfc60296f2e' \
            --output tmp/shared-chat-6a6ecf5c \
            --skip-assets
          find tmp/shared-chat-6a6ecf5c -type f -maxdepth 2 -print

      - name: Commit extraction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/shared-chat-6a6ecf5c
          if git diff --cached --quiet; then
            echo "No extracted changes"
          else
            git commit -m "共有会話の内容を抽出"
            git push origin HEAD:${{ github.head_ref }}
          fi
