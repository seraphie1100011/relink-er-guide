                  'author': '@age_vocalo1226',
                  'postedAt': '2026-07-15T18:42:15+09:00',
                  'registeredAt': registered_at,
                  'usefulness': 97,
                  'confidence': '高',
                  'status': '確認済み',
                  'media': 'none'
              },
              'x-search-fill-eugen-support-cpu-20260802': {
                  'id': 'x-search-fill-eugen-support-cpu-20260802',
                  'title': 'NPCオイゲンをフェディエル以上のサポート火力へ育成',
                  'summary': 'CPU・放置用サポートキャラクターとしてオイゲンを重点育成し、投稿者の比較ではフェディエルを上回る結果になったという構成紹介です。装備画像が付属していますが、比較対象、計測時間、クエスト、ダメージ値は追加確認が必要です。',
                  'character': 'オイゲン',
                  'category': 'CPU・放置',
                  'attributes': ['CPU', '放置', 'サポート', '装備', 'フェディエル比較', '編成'],
                  'sourceUrl': 'https://x.com/KamuiTakegami/status/2077516991964012696',
                  'author': '@KamuiTakegami',
                  'postedAt': '2026-07-16T07:13:43+09:00',
                  'registeredAt': registered_at,
                  'usefulness': 87,
                  'confidence': '中',
                  'status': '要追加検証',
                  'media': 'image'
              }
          }

          additions = [
              {
                  'id': 'x-search-mak1baoh-katalina-combo-c-20260802',
                  'title': 'コンボCでアレスゲージを一度に50％回収',
                  'summary': 'アレスゲージが切れ、蒼天の剣も使えない状況では、コンボC「□→□→□→△」を使うと一度でアレスゲージを50％回収できるという小技です。3段目後に回避を挟むと移動距離を伸ばせるとも説明されています。',
                  'character': 'カタリナ',
                  'category': 'キャラクター攻略',
                  'attributes': ['コンボ', 'アレスゲージ', '回避キャンセル', '立ち回り', 'Tips'],
                  'sourceUrl': x_search('from:mak1baoh_go "コンボC" "アレスゲージ"'),
                  'sourceLinkType': 'search',
                  'author': '@mak1baoh_go',
                  'postedAt': '',
                  'registeredAt': registered_at,
                  'usefulness': 96,
                  'confidence': '中',
                  'status': '要追加検証',
                  'media': 'image'
              },
              {
                  'id': 'x-search-dpf9-fediel-77b-20260802',
                  'title': 'フェディエルで60秒7.7億ダメージ',
                  'summary': 'フェディエルの60秒トライアルで7.7億ダメージを記録した画像付き投稿です。装備、召喚石、マスタースキル、具体的な攻撃手順は検索結果上では確認できないため、追加検証が必要です。',
                  'character': 'フェディエル',
                  'category': 'キャラクター攻略',
