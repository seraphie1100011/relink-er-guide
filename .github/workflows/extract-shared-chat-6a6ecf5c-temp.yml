name: Import shared chat 6a6ecf5c

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  import:
    if: github.head_ref == 'import-shared-chat-6a6ecf5c'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply extracted information
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import quote

          path = Path('data/posts.json')
          posts = json.loads(path.read_text(encoding='utf-8'))
          before = len(posts)
          registered_at = '2026-08-02T14:10:00+09:00'

          def x_search(query):
              return 'https://x.com/search?q=' + quote(query, safe='') + '&f=live'

          replacements = {
              'x-search-fill-charlotta-invincibility-loop-20260802': {
                  'id': 'x-search-fill-charlotta-invincibility-loop-20260802',
                  'title': '無敵スタイルは約19秒継続し、約3秒の隙で再使用可能',
                  'summary': 'マスターランク30のシャルロッテで、無敵アビリティの基本16秒にアビリティ3回分の延長3秒を加え、合計約19秒の無敵時間を確保する運用です。無敵中に攻撃を当て続けると約22秒で再使用可能となり、理論上は無敵終了後およそ3秒で再び無敵へ移行できます。投稿者の構成はクイックアビリティ45、怒涛16です。',
                  'character': 'シャルロッテ',
                  'category': 'キャラクター攻略',
