                  'sourceUrl': x_search('from:dpF9tkmZkD3AZUA "フェディエル60秒7.7億"'),
                  'sourceLinkType': 'search',
                  'author': '@dpF9tkmZkD3AZUA',
                  'postedAt': '',
                  'registeredAt': registered_at,
                  'usefulness': 90,
                  'confidence': '中',
                  'status': '要追加検証',
                  'media': 'image'
              },
              {
                  'id': 'x-search-merridozer-maglielle-7b-20260724',
                  'title': 'マギラフリラで60秒7億ダメージ',
                  'summary': 'マギラフリラの60秒計測で7億ダメージを記録した投稿です。画像または動画が付属していますが、装備、召喚石、ダメージ上限、使用コンボは追加確認が必要です。検索結果では2026年7月24日19時23分の投稿として表示されています。',
                  'character': 'マギラフリラ',
                  'category': 'キャラクター攻略',
                  'attributes': ['DPS', '60秒トライアル', '火力', 'ダメージ計測'],
                  'sourceUrl': x_search('from:merridozer "マギラフリラ" "60秒7億"'),
                  'sourceLinkType': 'search',
                  'author': '@merridozer',
                  'postedAt': '',
                  'registeredAt': registered_at,
                  'usefulness': 94,
                  'confidence': '中',
                  'status': '要追加検証',
                  'media': 'video'
              },
              {
                  'id': 'x-search-vayne-pb-maglielle-world-infinity-solo-20260724',
                  'title': 'マギラフリラ単騎でザ・ワールド・インフィニティをクリア',
                  'summary': 'マギラフリラ単騎でザ・ワールドのインフィニティ難度をクリアした動画投稿です。検索結果ではYouTube動画への導線を確認できますが、装備構成や討伐時間は未確認です。検索結果では2026年7月24日4時18分の投稿として表示されています。',
