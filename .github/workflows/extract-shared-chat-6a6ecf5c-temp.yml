                  'category': 'ボス攻略',
                  'attributes': ['単騎', 'インフィニティ', 'ザ・ワールド', '実戦動画', '高難度'],
                  'sourceUrl': x_search('from:Vayne_PB "マギラフリラ単騎" "ザ・ワールド" "インフィニティ"'),
                  'sourceLinkType': 'search',
                  'author': '@Vayne_PB',
                  'postedAt': '',
                  'registeredAt': registered_at,
                  'usefulness': 92,
                  'confidence': '中',
                  'status': '要追加検証',
                  'media': 'video'
              },
              {
                  'id': 'x-2077520859598917645',
                  'title': 'コフィンメーカー型ラカムでCHAOS++放置周回',
                  'summary': 'コフィンメーカー型ラカムをフルアシストで使用し、CHAOS++「黙示ルシファー」を2分48秒、「絶対者ベルゼバブ」を3分31秒でクリアした報告です。装備、マスタースキル、残りのパーティメンバーは投稿画像の追加確認が必要です。',
                  'character': 'ラカム',
                  'category': 'CPU・放置',
                  'attributes': ['フルアシスト', 'CPU', 'コフィンメーカー', 'CHAOS++', 'ルシファー', 'ベルゼバブ', '周回タイム'],
                  'sourceUrl': 'https://x.com/Rin_gamediary/status/2077520859598917645',
                  'author': '@Rin_gamediary',
                  'postedAt': '2026-07-16T07:29:06+09:00',
                  'registeredAt': registered_at,
                  'usefulness': 94,
                  'confidence': '高',
                  'status': '要追加検証',
                  'media': 'image'
              },
              {
                  'id': 'x-2077551179031257569',
                  'title': 'ジャストガードからリンクアタックへつなぐ耐久型ヴェイン',
                  'summary': 'ヴェインの高い耐久力と安定性を活かし、敵の攻撃をジャストガードしてリンクアタックへ移行する実戦運用です。詳細な装備数値は未確認ですが、ガード主体でも攻撃機会を失いにくいヴェイン固有の立ち回りです。',
                  'character': 'ヴェイン',
                  'category': 'キャラクター攻略',
                  'attributes': ['ジャストガード', 'リンクアタック', '耐久', '生存', '立ち回り', '高難度'],
                  'sourceUrl': 'https://x.com/nagarebosi0712/status/2077551179031257569',
                  'author': '@nagarebosi0712',
                  'postedAt': '2026-07-16T09:29:34+09:00',
                  'registeredAt': registered_at,
                  'usefulness': 80,
                  'confidence': '中',
                  'status': '要追加検証',
                  'media': 'none'
              },
              {
                  'id': 'x-2077532885054259241',
                  'title': '火力低下後も上限増加バフと10万バリアで高難度支援',
                  'summary': 'ER環境ではカリオストロ自身の火力が下がった一方、ファンタズマゴリアによるダメージ上限増加の付与と、10万相当のバリアによって安定した支援役として運用できるという評価です。バリア量の条件や上限増加量は追加検証が必要です。',
                  'character': 'カリオストロ',
                  'category': 'キャラクター攻略',
                  'attributes': ['ファンタズマゴリア', 'ダメージ上限', 'バリア', '支援', '高難度', '弱体化比較'],
                  'sourceUrl': 'https://x.com/kemble1_1/status/2077532885054259241',
                  'author': '@kemble1_1',
                  'postedAt': '2026-07-16T08:16:53+09:00',
                  'registeredAt': registered_at,
                  'usefulness': 88,
                  'confidence': '中',
                  'status': '要追加検証',
                  'media': 'none'
              }
          ]

          replaced = 0
          for index, post in enumerate(posts):
              post_id = str(post.get('id', '')).strip()
              if post_id in replacements:
                  posts[index] = replacements[post_id]
                  replaced += 1

          assert replaced == 2, f'expected 2 replacements, got {replaced}'

          ids = {str(post.get('id', '')).strip() for post in posts}
          urls = {str(post.get('sourceUrl', '')).strip() for post in posts}
          appended = 0
          for post in additions:
              if post['id'] in ids or post['sourceUrl'] in urls:
                  continue
              posts.append(post)
              ids.add(post['id'])
              urls.add(post['sourceUrl'])
              appended += 1

          assert appended == 7, f'expected 7 additions, got {appended}'
          assert len(posts) == before + 7, (before, len(posts))
          assert len({post['id'] for post in posts}) == len(posts), 'duplicate ids'
          assert len({post['sourceUrl'] for post in posts}) == len(posts), 'duplicate source URLs'

          for post in posts:
              assert post.get('id') and post.get('title') and post.get('summary')
              assert post.get('sourceUrl', '').startswith('https://x.com/')
              assert isinstance(post.get('attributes'), list)

          path.write_text(json.dumps(posts, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps({'before': before, 'after': len(posts), 'added': appended, 'upgraded': replaced}, ensure_ascii=False))
          PY

      - name: Commit data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/posts.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "共有会話からキャラ攻略情報7件を追加し2件を更新"
            git push origin HEAD:${{ github.head_ref }}
          fi
