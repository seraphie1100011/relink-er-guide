name: Refresh shared chat 6a6dd59a night

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  extract:
    if: github.head_ref == 'refresh-shared-chat-6a6dd59a-20260803-night'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Prepare extractor
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests
          git clone --depth 1 https://github.com/vl3c/ChatPeek.git /tmp/ChatPeek

      - name: Extract latest shared conversation
        run: |
          rm -rf tmp/shared-chat-6a6dd59a-night
          mkdir -p tmp/shared-chat-6a6dd59a-night
          python /tmp/ChatPeek/ChatPeek.py \
            'https://chatgpt.com/share/6a6dd59a-64c0-83e8-b876-1d347c36e215' \
            --output tmp/shared-chat-6a6dd59a-night \
            --skip-assets
          find tmp/shared-chat-6a6dd59a-night -maxdepth 2 -type f -print

      - name: Commit extraction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/shared-chat-6a6dd59a-night
          if git diff --cached --quiet; then
            echo "No extraction changes"
          else
            git commit -m "共有会話6a6dd59aの最新内容を再抽出"
            git push origin HEAD:${{ github.head_ref }}
          fi
